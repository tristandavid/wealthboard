# Project-wide Gradle settings.

# Give the Gradle daemon enough heap for R8 / D8 to run without OOM.
# The default (512m) is too small when minification is enabled on a
# project this size. 2g is comfortable; raise to 3g if you still see
# Java heap space errors on a very large module.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Run configuration / compilation tasks in parallel where possible.
org.gradle.parallel=true

# Keep the daemon alive between builds for faster incremental builds.
org.gradle.daemon=true

# AndroidX — required for modern Jetpack libraries.
android.useAndroidX=true

# ── Incremental processing, off ───────────────────────────────────────────
#
# These two exist to route around a crash, not because non-incremental
# builds are desirable. Turn them back on (or just delete both lines) once
# the project builds cleanly for you — rebuilds get noticeably faster.
#
# The crash they avoid:
#
#   Execution failed for task ':app:kspDebugKotlin'
#   > Internal compiler error
#     Caused by: java.lang.IllegalArgumentException: 25.0.3
#       at com.intellij.util.lang.JavaVersion.parse(JavaVersion.java:305)
#       at com.intellij.util.io.ByteBufferUtil.cleanBuffer(ByteBufferUtil.java:23)
#       at com.intellij.util.io.PersistentMapImpl.close(PersistentMapImpl.java:812)
#       at com.google.devtools.ksp.common.IncrementalContextBase
#           .updateCachesAndOutputs(IncrementalContextBase.kt:742)
#
# Read that bottom-up: KSP finishes, goes to close its incremental caches,
# those caches are memory-mapped files, and unmapping one needs to know
# which Java version is running (the unmap API changed in Java 9). The
# version parser Kotlin 1.9.24 ships predates JDK 24 and throws on "25.0.3".
#
# The supported fix is to keep the compiler off JDK 24+, which is what the
# toolchain in app/build.gradle.kts does. But that fight has to be won by
# every JDK in the chain — the Gradle daemon, the Kotlin compile daemon, and
# any daemon left running from a previous build — and losing it anywhere
# reproduces the crash. Switching the incremental caches off means KSP never
# opens the memory-mapped files in the first place, so the failing code path
# is never reached, whichever JDK ends up running the compiler. It is the
# belt to the toolchain's braces.
#
# If the build still fails after this, the cause is something else and the
# stack trace will say so: run `gradlew assembleDebug --stacktrace`.
ksp.incremental=false
kotlin.incremental=false
