# XcodeGen spec — an alternative to the checked-in .xcodeproj.
#
# The .xcodeproj in this repo uses Xcode 16's file-system-synchronized groups,
# so new files are picked up without touching it. This spec exists for anyone
# who would rather regenerate the project (`xcodegen generate`) than trust a
# hand-written pbxproj, and it produces the same target.
name: WealthBoard
options:
  bundleIdPrefix: ca.tristan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Keep these in step with the checked-in project and Info.plist, or a
    # regenerated project silently ships an older version than the one you
    # think you are building.
    MARKETING_VERSION: "1.10.0"
    CURRENT_PROJECT_VERSION: "15"
targets:
  WealthBoard:
    type: application
    platform: iOS
    sources:
      - path: WealthBoard
        excludes:
          - "Resources/Info.plist"
          - "WealthBoard.entitlements"
          # Excluded HERE because it is listed again below with an explicit
          # build phase. Without this line the catalog is included twice — once
          # swept up by this recursive folder, once by that entry — and the
          # build fails with "Multiple commands produce .../Assets.car", one a
          # copy command and one a process command. The folder scan cannot tell
          # that the entry below is the same directory.
          - "Resources/Assets.xcassets"
      - path: WealthBoard/Resources/Assets.xcassets
        buildPhase: resources
    # Firebase powers sign-in and cloud backup. Both files that use it are
    # wrapped in `#if canImport(...)`, so the app still builds and runs with
    # this block removed — it just falls back to local-only, with the file
    # backup in Menu ▸ Backup & Restore as the safety net.
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      # Google sign-in. Separate package from Firebase: FirebaseAuth exchanges
      # the tokens but does not run the flow that produces them.
      # GoogleSignInSwift is the SwiftUI button — its own product, and without
      # it `LoginView` falls back to a plain text button.
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.tristan.wealthboard
        INFOPLIST_FILE: WealthBoard/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"

# Swift packages. Pinned to a major version rather than a branch: a build
# that changes because someone else pushed is not a build you can reproduce.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
